name: Build Orpheus Server (Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg pkg-config libssl-dev

      - name: Build release (server only)
        run: cargo build --release -p remux-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remux-server-linux
          path: target/release/remux-server
          retention-days: 7
